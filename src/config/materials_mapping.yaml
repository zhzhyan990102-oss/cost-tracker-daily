# 原材料 → 产地 → 品类成本影响映射表
# cost_weight: 该原材料占成品总成本的比重（0-1），用于量化成本影响
#
# 成本影响 = 原材料价格变化率 × cost_weight
# 例：冷轧板涨5%，cost_weight=0.45 → 置物架成本上升约 5%×0.45 = 2.25%

mappings:
  # ======== 钢材类 ========
  - material: "冷轧板卷"
    affects:
      - category: "置物架"
        regions: ["广东", "山东"]
        cost_weight: 0.45
      - category: "衣橱架"
        regions: ["广东"]
        cost_weight: 0.40
      - category: "落地衣架"
        regions: ["广东", "广西"]
        cost_weight: 0.40
      - category: "钢木类家具"
        regions: ["江苏"]
        cost_weight: 0.30
      - category: "钢木类"
        regions: ["越南"]
        cost_weight: 0.35
      - category: "钢木床"
        regions: ["越南"]
        cost_weight: 0.35
      - category: "置物架"
        regions: ["柬埔寨"]
        cost_weight: 0.45

  - material: "热轧板卷"
    affects:
      - category: "置物架"
        regions: ["广东", "山东"]
        cost_weight: 0.25
      - category: "衣橱架"
        regions: ["广东"]
        cost_weight: 0.20
      - category: "落地衣架"
        regions: ["广东", "广西"]
        cost_weight: 0.20
      - category: "钢木类家具"
        regions: ["江苏"]
        cost_weight: 0.25
      - category: "钢木类"
        regions: ["越南"]
        cost_weight: 0.25
      - category: "钢木床"
        regions: ["越南"]
        cost_weight: 0.30

  - material: "管材"
    affects:
      - category: "置物架"
        regions: ["广东", "山东"]
        cost_weight: 0.15
      - category: "衣橱架"
        regions: ["广东"]
        cost_weight: 0.10
      - category: "落地衣架"
        regions: ["广东", "广西"]
        cost_weight: 0.20
      - category: "钢木类家具"
        regions: ["江苏"]
        cost_weight: 0.10

  # ======== 木材/人造板 ========
  - material: "刨花板"
    affects:
      - category: "板式家具"
        regions: ["福建"]
        cost_weight: 0.50
      - category: "床架"
        regions: ["福建", "马来西亚"]
        cost_weight: 0.40
      - category: "钢木类家具"
        regions: ["江苏"]
        cost_weight: 0.20
      - category: "置物架"
        regions: ["柬埔寨"]
        cost_weight: 0.10

  - material: "中纤板MDF"
