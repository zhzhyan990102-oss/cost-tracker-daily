name: Keep Repository Active

# 防止公开仓库 60 天无活动导致定时 workflow 被禁用
# 每月1号自动提交一次空 commit

on:
  schedule:
    - cron: "0 3 1 * *"   # 每月1号 UTC 3:00
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive
        run: |
          date > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --staged --quiet || git commit -m "chore: keepalive $(date +%Y-%m)"
          git push
