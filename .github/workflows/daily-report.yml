name: Daily Cost Tracking Report

on:
  schedule:
    # 北京时间每天早上 8:00（UTC+8 → UTC 0:00）
    - cron: "0 0 * * *"
  workflow_dispatch:    # 允许手动触发（调试/补发）

env:
  PYTHON_VERSION: "3.12"

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily report pipeline
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python -m src.main

      - name: Commit detail reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ cache/
          git diff --staged --quiet || git commit -m "docs: 更新 $(date +%Y-%m-%d) 成本跟盘日报明细"
          git push

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-reports-${{ github.run_id }}
          path: reports/
          retention-days: 7

      - name: Notify failure to DingTalk
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from src.pushers.dingtalk import DingTalkPusher
          pusher = DingTalkPusher()
          pusher.send_text(
              '⚠️ 成本跟盘日报系统执行失败！\n'
              '请检查 GitHub Actions 日志：\n'
              'https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}'
          )
          "
