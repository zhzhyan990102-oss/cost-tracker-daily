name: Daily Cost Tracking Report

on:
  schedule:
    # 北京时间每天早上 8:00（UTC+8 → UTC 0:00）
    - cron: "0 0 * * *"
  workflow_dispatch:    # 允许手动触发（调试/补发）

env:
  PYTHON_VERSION: "3.12"

jobs:
  daily-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import akshare, loguru, dingtalkchatbot; print('All imports OK')"

      - name: Run daily report pipeline
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python -m src.main
          echo "EXIT_CODE=$?"

      - name: Notify failure to DingTalk
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python -c "
          import requests, os
          webhook = os.environ.get('DINGTALK_WEBHOOK', '')
          if webhook:
              resp = requests.post(webhook, json={
                  'msgtype': 'text',
                  'text': {'content': '⚠️ 成本跟盘日报系统执行失败！\n请检查 GitHub Actions 日志：\nhttps://github.com/zhzhyan990102-oss/cost-tracker-daily/actions'}
              }, timeout=15)
              print(resp.json())
          else:
              print('No webhook configured')
          "
